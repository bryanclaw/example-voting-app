name: CI Pipeline

on:
  push:
    branches: [ main, feature/99-devops-setup ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Docker images
      run: |
        docker-compose --version
        docker-compose build
        echo "✅ Docker images built successfully"
      
    - name: Start services and test
      run: |
        # Start services in background
        docker-compose up -d
        
        # Wait for services to start
        sleep 15
        
        # Check if containers are running
        echo "--- Running Containers ---"
        docker-compose ps
        
        # Simple test - if containers are running, consider it a success
        RUNNING_CONTAINERS=$(docker-compose ps -q | wc -l)
        echo "Number of running containers: $RUNNING_CONTAINERS"
        
        if [ $RUNNING_CONTAINERS -ge 3 ]; then
          echo "✅ SUCCESS: Multiple services are running"
          exit 0
        else
          echo "❌ FAILED: Not enough services running"
          exit 1
        fi
        
    - name: Show service logs
      if: always()
      run: |
        echo "--- Service Logs ---"
        docker-compose logs --tail=50